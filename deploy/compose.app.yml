# The public API stack on the VM (infra spec, section 3): Postgres, the API, and Caddy for TLS.
# A separate compose project from ingest (deploy/compose.ingest.yml), so an app deploy can never
# restart the archive (hard rule 3). Deployed by deploy/remote-deploy-app.sh, which writes the
# .env next to this file from SSM: API_TAG (a git SHA), API_DOMAIN, and the database passwords.
#
# Postgres is never published to the host: only Caddy's 80 and 443 are (the security group
# allows nothing else).

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  postgres:
    <<: *hardening
    image: postgres:16.12-alpine
    restart: always
    environment:
      POSTGRES_DB: ghostbus
      POSTGRES_USER: ghostbus # the owner: runs migrations and sets role passwords
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set from SSM by the deploy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: during first-time setup the temporary server answers only on the socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ghostbus -d ghostbus"]
      interval: 10s
      timeout: 3s
      retries: 10
    shm_size: 128m
    mem_limit: 768m

  # One-off: migrations as the owner, then login and passwords for the pipeline and api roles
  # (ADR-007). Run by the deploy with `run --rm migrate`; never started by `up`.
  migrate:
    <<: *hardening
    image: ghcr.io/denisyumaev/ghost-bus-la-api:${API_TAG:?API_TAG must be a git SHA}
    profiles: ["tools"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      GHOSTBUS_DATABASE_URL: postgresql+psycopg://ghostbus:${POSTGRES_PASSWORD}@postgres:5432/ghostbus
      GHOSTBUS_API_DB_PASSWORD: ${API_DB_PASSWORD:?set from SSM by the deploy}
      GHOSTBUS_PIPELINE_DB_PASSWORD: ${PIPELINE_DB_PASSWORD:?set from SSM by the deploy}
    command: ["sh", "-c", "python -m ghostbus_api.migrations && python -m ghostbus_api.roles"]
    read_only: true
    cap_drop: [ALL]
    mem_limit: 256m

  api:
    <<: *hardening
    image: ghcr.io/denisyumaev/ghost-bus-la-api:${API_TAG:?API_TAG must be a git SHA}
    restart: always
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      GHOSTBUS_DATABASE_URL: postgresql+psycopg://api:${API_DB_PASSWORD}@postgres:5432/ghostbus
      GHOSTBUS_SITE_URL: https://${SITE_DOMAIN:?SITE_DOMAIN must be set}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 384m

  caddy:
    <<: *hardening
    image: caddy:2.10.2-alpine
    restart: always
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443" # TCP only: the security group doesn't allow UDP, so no HTTP/3
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN must be set}
      # Not read by Caddy: a new Caddyfile changes this value, which recreates the container
      # (the file is bind-mounted and the admin API is off, so nothing else reloads it).
      CADDYFILE_SHA: ${CADDYFILE_SHA:?set by the deploy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/caddy-health"]
      interval: 15s
      timeout: 3s
      retries: 3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates and the ACME account: must survive redeploys
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 128m

volumes:
  pgdata:
  caddy_data:
  caddy_config:
