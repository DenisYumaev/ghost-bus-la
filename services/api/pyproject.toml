[project]
name = "ghostbus-api"
version = "0.1.0"
description = "Public REST API and the Postgres schema for LA Bus Reliability (repo: ghost-bus-la). Not affiliated with LA Metro."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",  # the API (stack list)
    "pydantic>=2.7",  # response models (stack list)  # migrations for the ops and app schemas (ADR-007 decision 4)
    "psycopg[binary]>=3.2",  # PostgreSQL driver (stack: psycopg 3)
    "sqlalchemy>=2.0",  # engine and connection handling; repositories write plain SQL
    "uvicorn>=0.30",  # ASGI server (ADR-013)
]

[dependency-groups]
dev = [
    "ghostbus-publish",  # integration tests publish the dbt test world into Postgres
    "httpx>=0.27",  # FastAPI's TestClient
]

[tool.uv.sources]
ghostbus-publish = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
