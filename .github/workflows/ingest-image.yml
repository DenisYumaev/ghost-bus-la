name: ingest image

# Builds the ingest image for linux/arm64 (the VM is a t4g) on GitHub's ARM runner.
# Pull requests build only, which proves the Dockerfile works. Pushes to main also publish it
# to GitHub Container Registry: ghcr.io/denisyumaev/ghost-bus-la-ingest:<git sha> and :main.
# The VM pulls by SHA, so a deploy always names the exact build (infra spec, section 6).

on:
  pull_request:
    paths:
      - services/ingest/**
      - config/**
      - pyproject.toml
      - uv.lock
      - .dockerignore
      - .github/workflows/ingest-image.yml
  push:
    branches: [main]
    paths:
      - services/ingest/**
      - config/**
      - pyproject.toml
      - uv.lock
      - .dockerignore
      - .github/workflows/ingest-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/denisyumaev/ghost-bus-la-ingest

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # publish to GHCR on main; unused on pull requests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/ingest/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Ghost Bus LA ingest. Not affiliated with LA Metro.
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker build -q -f services/ingest/Dockerfile -t ingest:smoke .
          docker run --rm --entrypoint python ingest:smoke -c "import ghostbus_ingest.service"
          # No GHOSTBUS_BUCKET: the service must log config_error and exit 2, not crash.
          code=0; docker run --rm ingest:smoke || code=$?
          test "$code" -eq 2
