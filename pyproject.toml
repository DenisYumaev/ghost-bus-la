[project]
name = "ghost-bus-la"
version = "0.1.0"
description = "Workspace root for Ghost Bus LA. Not affiliated with LA Metro."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "boto3",
    "hypothesis",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]

# One virtual environment and one lockfile for every package below.
# Each member has its own pyproject.toml and declares its own dependencies.
# `uv sync --all-packages` installs all of them; the root itself is never installed.
[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade,
# S bandit (security), DTZ naive datetimes, PT pytest style, SIM simplify, RUF ruff.
select = ["E", "W", "F", "I", "B", "UP", "S", "DTZ", "PT", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks things.
"**/tests/**" = ["S101"]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# Each src/ dir (and scripts/) is a root that module names are counted from,
# so src/ghostbus_core/__init__.py is the module `ghostbus_core`, as at runtime.
# Test directories hold top-level modules: keep test file names unique.
mypy_path = ["packages/ghostbus_core/src", "services/ingest/src", "scripts"]
explicit_package_bases = true

# boto3 and botocore ship no type hints. Code that uses them defines a small Protocol for the
# calls it makes, so mypy still checks our side of every call.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# importlib mode lets several directories named tests/ coexist without __init__.py files.
addopts = ["--import-mode=importlib", "--strict-markers", "-ra"]
testpaths = ["packages", "services", "tests"]
pythonpath = ["scripts"]
xfail_strict = true

[tool.coverage.run]
source = ["ghostbus_core", "ghostbus_ingest"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true
