# Ghost Bus LA dbt project (pipeline spec, section 6). Run from the repo root:
#   make dbt            # sync must have filled data/ first (make dbt-sync START= END=)
name: ghostbus
version: "1.0"
profile: ghostbus
config-version: 2

# Tests run offline (hard rule 10): no usage tracking.
flags:
  send_anonymous_usage_stats: false

model-paths: [models]
test-paths: [tests]
macro-paths: [macros]
# The hand-checked GTFS time cases are shared with the Python tests (pipeline spec, section 5).
seed-paths: ["../../tests/fixtures/dbt_seeds"]  # only CSVs meant as dbt seeds

vars:
  # Local folder filled by `ghostbus_decode.sync` with marker-listed files only.
  data_dir: data

models:
  ghostbus:
    +materialized: table

seeds:
  ghostbus:
    gtfs_time_cases:
      +column_types:
        service_date: varchar
        gtfs_time: varchar
        expected_utc: varchar
        why: varchar
