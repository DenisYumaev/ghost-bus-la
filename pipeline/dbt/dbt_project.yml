# Ghost Bus LA dbt project (pipeline spec, section 6). Run from the repo root:
#   make dbt            # sync must have filled data/ first (make dbt-sync START= END=)
name: ghostbus
version: "1.0"
profile: ghostbus
config-version: 2

# Tests run offline (hard rule 10): no usage tracking.
flags:
  send_anonymous_usage_stats: false

model-paths: [models]
test-paths: [tests]
macro-paths: [macros]
# The hand-checked GTFS time cases are shared with the Python tests (pipeline spec, section 5).
seed-paths: ["../../tests/fixtures/dbt_seeds"]  # only CSVs meant as dbt seeds

vars:
  # Local folder filled by `ghostbus_decode.sync` with marker-listed files only.
  data_dir: data
  # Outcome thresholds (pipeline spec, section 8): starting points, to be tuned against
  # hand-checked trips and frozen in an ADR. A sensitivity run is one --vars override.
  window_before_start_min: 30
  window_after_end_min: 60
  min_stop_coverage: 0.80
  min_feed_healthy_share: 0.90
  match_rate_alert: 0.95

models:
  ghostbus:
    +materialized: table

seeds:
  ghostbus:
    gtfs_time_cases:
      +column_types:
        service_date: varchar
        gtfs_time: varchar
        expected_utc: varchar
        why: varchar
