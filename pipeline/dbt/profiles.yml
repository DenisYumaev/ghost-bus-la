# DuckDB file under data/ (gitignored). Paths are relative to the repo root, where make runs.
ghostbus:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('GHOSTBUS_DUCKDB', 'data/ghostbus.duckdb') }}"
      threads: 2
      settings:
        memory_limit: "1GB"
        TimeZone: "UTC"
