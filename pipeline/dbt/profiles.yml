# DuckDB file under data/ (gitignored). Paths are relative to the repo root, where make runs.
ghostbus:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('GHOSTBUS_DUCKDB', 'data/ghostbus.duckdb') }}"
      threads: 2
      settings:
        memory_limit: "1GB"
        # UTC by default; tests run in Los Angeles time so SQL that relies on the session
        # zone fails (pipeline spec, section 5).
        TimeZone: "{{ env_var('GHOSTBUS_DBT_TZ', 'UTC') }}"
