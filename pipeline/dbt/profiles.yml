# DuckDB file under data/ (gitignored). Paths are relative to the repo root, where make runs.
ghostbus:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('GHOSTBUS_DUCKDB', 'data/ghostbus.duckdb') }}"
      # One thread: two heavy queries at once (int_trip_observations and the trip-updates grain
      # test) share DuckDB's memory limit and intermittently ran out at 4GB (2026-11-18, two of
      # four builds). Serial is still under a minute for two service dates.
      threads: 1
      settings:
        # A laptop build (ADR-023): 1GB ran out on the grain test over three days of trip
        # updates (127M rows). On the VM, set GHOSTBUS_DBT_MEMORY lower and sync fewer days.
        memory_limit: "{{ env_var('GHOSTBUS_DBT_MEMORY', '4GB') }}"
        # Lets large aggregates (grain tests over ~40M trip-update rows a day) stream and
        # spill to DuckDB's default temp folder next to the database file. (Setting
        # temp_directory here fails: dbt-duckdb reapplies settings on every connection.)
        preserve_insertion_order: false
        # UTC by default; tests run in Los Angeles time so SQL that relies on the session
        # zone fails (pipeline spec, section 5).
        TimeZone: "{{ env_var('GHOSTBUS_DBT_TZ', 'UTC') }}"
