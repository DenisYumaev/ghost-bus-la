      - input: ref('fct_trip_outcomes')
        rows:
          - {service_date: "2026-12-31", trip_id: a, line: "1", direction_id: 0, sched_start_utc: "2026-12-31 16:00:00+00", outcome: ran, announced: false, is_metro_operated: null}
          # 25:30 of Dec 31: 01:30 local on Jan 1, but Dec 31's service.
          - {service_date: "2026-12-31", trip_id: b, line: "1", direction_id: 0, sched_start_utc: "2027-01-01 09:30:00+00", outcome: ran, announced: false, is_metro_operated: null}
