        # Both directions: pooled trips, not an average of the direction rates.
        - {line: "1", direction_id: null, time_window: "28d", n_service_days: 2, n_trips: 3, n_missed: 2, n_missed_announced: 1, missed_rate: 0.6666666666666666, announced_rate: 0.3333333333333333, unplanned_rate: 0.3333333333333333, unplanned_share: 0.5, suppressed: false}
