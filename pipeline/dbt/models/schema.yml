  - name: stg_cancellations_uses_one_chosen_state_per_fetch_and_tracks_the_final_episode
    model: stg_cancellations
    given:
      - input: ref('stg_trip_reports')
        rows:
          # A: canceled in two fetches; a non-chosen duplicate CANCELED doesn't add a snapshot.
          - {trip_id: A, service_date: "2026-11-15", fetched_at: "2026-11-15 10:00:00+00", is_chosen: true, trip_schedule_relationship: CANCELED}
          - {trip_id: A, service_date: "2026-11-15", fetched_at: "2026-11-15 10:01:00+00", is_chosen: true, trip_schedule_relationship: CANCELED}
          - {trip_id: A, service_date: "2026-11-15", fetched_at: "2026-11-15 10:01:00+00", is_chosen: false, trip_schedule_relationship: CANCELED}
          # B: canceled, then SCHEDULED in a later fetch: reinstated at that fetch.
          - {trip_id: B, service_date: "2026-11-15", fetched_at: "2026-11-15 10:00:00+00", is_chosen: true, trip_schedule_relationship: CANCELED}
          - {trip_id: B, service_date: "2026-11-15", fetched_at: "2026-11-15 10:05:00+00", is_chosen: true, trip_schedule_relationship: SCHEDULED}
          - {trip_id: B, service_date: "2026-11-15", fetched_at: "2026-11-15 10:06:00+00", is_chosen: true, trip_schedule_relationship: SCHEDULED}
          # E: canceled, scheduled, canceled again: notice runs from the final episode.
          - {trip_id: E, service_date: "2026-11-15", fetched_at: "2026-11-15 06:00:00+00", is_chosen: true, trip_schedule_relationship: CANCELED}
          - {trip_id: E, service_date: "2026-11-15", fetched_at: "2026-11-15 07:00:00+00", is_chosen: true, trip_schedule_relationship: SCHEDULED}
          - {trip_id: E, service_date: "2026-11-15", fetched_at: "2026-11-15 08:00:00+00", is_chosen: true, trip_schedule_relationship: CANCELED}
          # I: two live entities interleave. The non-chosen SCHEDULED duplicate (a stale
          # vehicle report) must not split the episode or reinstate.
          - {trip_id: I, service_date: "2026-11-15", fetched_at: "2026-11-15 10:00:00+00", is_chosen: true, trip_schedule_relationship: CANCELED}
          - {trip_id: I, service_date: "2026-11-15", fetched_at: "2026-11-15 10:01:00+00", is_chosen: false, trip_schedule_relationship: SCHEDULED}
          - {trip_id: I, service_date: "2026-11-15", fetched_at: "2026-11-15 10:01:00+00", is_chosen: true, trip_schedule_relationship: CANCELED}
          - {trip_id: I, service_date: "2026-11-15", fetched_at: "2026-11-15 10:02:00+00", is_chosen: true, trip_schedule_relationship: CANCELED}
          # L: CANCELED only as a losing duplicate: Metro's newest word was SCHEDULED, no row.
          - {trip_id: L, service_date: "2026-11-15", fetched_at: "2026-11-15 10:00:00+00", is_chosen: false, trip_schedule_relationship: CANCELED}
          - {trip_id: L, service_date: "2026-11-15", fetched_at: "2026-11-15 10:00:00+00", is_chosen: true, trip_schedule_relationship: SCHEDULED}
          # A on another service date: SCHEDULED only; doesn't reinstate A.
          - {trip_id: A, service_date: "2026-11-16", fetched_at: "2026-11-15 12:00:00+00", is_chosen: true, trip_schedule_relationship: SCHEDULED}
    expect:
      rows:
        - {trip_id: A, first_seen_at: "2026-11-15 10:00:00+00", first_ever_canceled_at: "2026-11-15 10:00:00+00", last_seen_at: "2026-11-15 10:01:00+00", n_snapshots: 2, reinstated_at: null, reinstated: false}
        - {trip_id: B, first_seen_at: "2026-11-15 10:00:00+00", first_ever_canceled_at: "2026-11-15 10:00:00+00", last_seen_at: "2026-11-15 10:00:00+00", n_snapshots: 1, reinstated_at: "2026-11-15 10:05:00+00", reinstated: true}
        - {trip_id: E, first_seen_at: "2026-11-15 08:00:00+00", first_ever_canceled_at: "2026-11-15 06:00:00+00", last_seen_at: "2026-11-15 08:00:00+00", n_snapshots: 2, reinstated_at: null, reinstated: false}
        - {trip_id: I, first_seen_at: "2026-11-15 10:00:00+00", first_ever_canceled_at: "2026-11-15 10:00:00+00", last_seen_at: "2026-11-15 10:02:00+00", n_snapshots: 3, reinstated_at: null, reinstated: false}

