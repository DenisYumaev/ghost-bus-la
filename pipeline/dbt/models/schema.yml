          - {service_date: "2026-08-03", trip_id: c, line: "1", direction_id: 0, sched_start_utc: "2026-08-03 15:00:00+00", outcome: missed, announced: true, is_metro_operated: true}
          # The night clocks fall back: 10:30 UTC on Nov 1 is 02:30 PST (a fixed PDT offset says 03).
          - {service_date: "2026-10-31", trip_id: d, line: "1", direction_id: 0, sched_start_utc: "2026-11-01 10:30:00+00", outcome: ran, announced: false, is_metro_operated: null}
