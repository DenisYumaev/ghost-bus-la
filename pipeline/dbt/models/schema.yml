  - name: gold_tables_publish_intervals_only_where_the_rate_is
    model: fct_line_summary
    overrides:
      vars: {min_cell_trips: 2, min_cell_service_days_weekday: 2, min_cell_service_days_weekend: 99}
    given:
      - input: ref('int_trip_cells')
        rows:
          - {service_date: "2026-12-31", trip_id: a, line: "1", direction_id: 0, day_type: weekday, hour_local: 8, outcome: ran, announced: false}
          - {service_date: "2026-12-30", trip_id: b, line: "1", direction_id: 0, day_type: weekday, hour_local: 8, outcome: missed, announced: false}
          - {service_date: "2026-12-31", trip_id: c, line: "1", direction_id: 1, day_type: weekday, hour_local: 8, outcome: missed, announced: true}
      - input: ref('int_windows')
        rows:
          - {time_window: "28d", window_start: "2026-12-04", window_end: "2026-12-31"}
      - input: ref('int_bootstrap_intervals')
        rows:
          - {grain: line_direction, time_window: "28d", line: "1", direction_id: 0, missed_rate_ci_low: 0.1, missed_rate_ci_high: 0.9, unplanned_share_ci_low: 0.5, unplanned_share_ci_high: 1.0}
          # Direction 1 is suppressed (one trip): its interval must not be published.
          - {grain: line_direction, time_window: "28d", line: "1", direction_id: 1, missed_rate_ci_low: 0.2, missed_rate_ci_high: 0.8, unplanned_share_ci_low: 0.0, unplanned_share_ci_high: 1.0}
          # Both directions: matched on the NULL direction_id, not on a direction's row.
          - {grain: line, time_window: "28d", line: "1", direction_id: null, missed_rate_ci_low: 0.3, missed_rate_ci_high: 0.95, unplanned_share_ci_low: 0.25, unplanned_share_ci_high: 0.75}
    expect:
      rows:
        # Its one miss was unplanned: a share of 1, so no share interval (ADR-027).
        - {line: "1", direction_id: 0, suppressed: false, missed_rate_ci_low: 0.1, missed_rate_ci_high: 0.9, unplanned_share_ci_low: null, unplanned_share_ci_high: null}
        - {line: "1", direction_id: 1, suppressed: true, missed_rate_ci_low: null, missed_rate_ci_high: null, unplanned_share_ci_low: null, unplanned_share_ci_high: null}
        - {line: "1", direction_id: null, suppressed: false, missed_rate_ci_low: 0.3, missed_rate_ci_high: 0.95, unplanned_share_ci_low: 0.25, unplanned_share_ci_high: 0.75}

  - name: int_bootstrap_replicates_reweights_days_for_every_grain
    model: int_bootstrap_replicates
    given:
      - input: ref('int_trip_cells')
        rows:
          # Day 1: line 1 dir 0 hour 8, 2 trips, 1 missed (unplanned). Day 2: same cell, 1 trip
          # ran; plus line 2, 1 trip missed (announced).
          - {service_date: "2026-12-30", trip_id: a, line: "1", direction_id: 0, day_type: weekday, hour_local: 8, outcome: ran, announced: false}
          - {service_date: "2026-12-30", trip_id: b, line: "1", direction_id: 0, day_type: weekday, hour_local: 8, outcome: missed, announced: false}
          - {service_date: "2026-12-31", trip_id: c, line: "1", direction_id: 0, day_type: weekday, hour_local: 8, outcome: ran, announced: false}
          - {service_date: "2026-12-31", trip_id: d, line: "2", direction_id: 0, day_type: weekday, hour_local: 8, outcome: missed, announced: true}
      - input: ref('int_windows')
        rows:
          - {time_window: "28d", window_start: "2026-12-04", window_end: "2026-12-31"}
      - input: ref('int_bootstrap_weights')
        rows:
          # Replicate 1 drew Dec 30 twice; replicate 2 drew each day once.
          - {time_window: "28d", replicate: 1, service_date: "2026-12-30", weight: 2}
          - {time_window: "28d", replicate: 2, service_date: "2026-12-30", weight: 1}
          - {time_window: "28d", replicate: 2, service_date: "2026-12-31", weight: 1}
    expect:
      rows:
        - {grain: cell, time_window: "28d", replicate: 1, line: "1", direction_id: 0, day_type: weekday, hour_local: 8, n_trips: 4, n_missed: 2, n_unplanned: 2}
        - {grain: cell, time_window: "28d", replicate: 2, line: "1", direction_id: 0, day_type: weekday, hour_local: 8, n_trips: 3, n_missed: 1, n_unplanned: 1}
        - {grain: cell, time_window: "28d", replicate: 2, line: "2", direction_id: 0, day_type: weekday, hour_local: 8, n_trips: 1, n_missed: 1, n_unplanned: 0}
        - {grain: line_direction, time_window: "28d", replicate: 1, line: "1", direction_id: 0, day_type: null, hour_local: null, n_trips: 4, n_missed: 2, n_unplanned: 2}
        - {grain: line_direction, time_window: "28d", replicate: 2, line: "1", direction_id: 0, day_type: null, hour_local: null, n_trips: 3, n_missed: 1, n_unplanned: 1}
        - {grain: line_direction, time_window: "28d", replicate: 2, line: "2", direction_id: 0, day_type: null, hour_local: null, n_trips: 1, n_missed: 1, n_unplanned: 0}
        - {grain: line, time_window: "28d", replicate: 1, line: "1", direction_id: null, day_type: null, hour_local: null, n_trips: 4, n_missed: 2, n_unplanned: 2}
        - {grain: line, time_window: "28d", replicate: 2, line: "1", direction_id: null, day_type: null, hour_local: null, n_trips: 3, n_missed: 1, n_unplanned: 1}
        - {grain: line, time_window: "28d", replicate: 2, line: "2", direction_id: null, day_type: null, hour_local: null, n_trips: 1, n_missed: 1, n_unplanned: 0}
        - {grain: system, time_window: "28d", replicate: 1, line: null, direction_id: null, day_type: null, hour_local: null, n_trips: 4, n_missed: 2, n_unplanned: 2}
        - {grain: system, time_window: "28d", replicate: 2, line: null, direction_id: null, day_type: null, hour_local: null, n_trips: 4, n_missed: 2, n_unplanned: 1}

  - name: int_bootstrap_intervals_interpolate_like_quantile_cont
    model: int_bootstrap_intervals
    given:
      - input: ref('int_bootstrap_replicates')
        rows:
          # Five replicates of one cell, missed rates 0.1 .. 0.5 (10 trips each); positions
          # 0.025 x 4 = 0.1 and 0.975 x 4 = 3.9: 0.1 + 0.1 x 0.1 = 0.11 and 0.4 + 0.9 x 0.1 = 0.49.
          - {grain: cell, time_window: "28d", replicate: 1, line: "1", direction_id: 0, day_type: weekday, hour_local: 8, n_trips: 10, n_missed: 3, n_unplanned: 3}
          - {grain: cell, time_window: "28d", replicate: 2, line: "1", direction_id: 0, day_type: weekday, hour_local: 8, n_trips: 10, n_missed: 1, n_unplanned: 0}
          - {grain: cell, time_window: "28d", replicate: 3, line: "1", direction_id: 0, day_type: weekday, hour_local: 8, n_trips: 10, n_missed: 5, n_unplanned: 5}
          - {grain: cell, time_window: "28d", replicate: 4, line: "1", direction_id: 0, day_type: weekday, hour_local: 8, n_trips: 10, n_missed: 2, n_unplanned: 1}
          - {grain: cell, time_window: "28d", replicate: 5, line: "1", direction_id: 0, day_type: weekday, hour_local: 8, n_trips: 10, n_missed: 4, n_unplanned: 2}
          # A key with a constant rate: a zero-width interval; no missed trips: no share interval.
          - {grain: system, time_window: "28d", replicate: 1, line: null, direction_id: null, day_type: null, hour_local: null, n_trips: 4, n_missed: 0, n_unplanned: 0}
          - {grain: system, time_window: "28d", replicate: 2, line: null, direction_id: null, day_type: null, hour_local: null, n_trips: 8, n_missed: 0, n_unplanned: 0}
          # Mixed: a zero-missed replicate counts for the rate, not the share; a replicate with no
          # trips counts for neither. Rates 0 and 0.2 (n = 2); one share replicate, 0.5 (n = 1,
          # where the position is exactly 0 and floor = ceil).
          - {grain: cell, time_window: "28d", replicate: 1, line: "2", direction_id: 0, day_type: weekday, hour_local: 8, n_trips: 10, n_missed: 0, n_unplanned: 0}
          - {grain: cell, time_window: "28d", replicate: 2, line: "2", direction_id: 0, day_type: weekday, hour_local: 8, n_trips: 10, n_missed: 2, n_unplanned: 1}
          - {grain: cell, time_window: "28d", replicate: 3, line: "2", direction_id: 0, day_type: weekday, hour_local: 8, n_trips: 0, n_missed: 0, n_unplanned: 0}
    expect:
      rows:
        # Shares 1, 0, 1, 0.5, 0.5 sorted 0, 0.5, 0.5, 1, 1: 0.05 and 1.0.
        - {grain: cell, line: "1", direction_id: 0, n_replicates: 5, n_share_replicates: 5, missed_rate_ci_low: 0.11000000000000001, missed_rate_ci_high: 0.49, unplanned_share_ci_low: 0.05, unplanned_share_ci_high: 1.0}
        - {grain: system, line: null, direction_id: null, n_replicates: 2, n_share_replicates: null, missed_rate_ci_low: 0.0, missed_rate_ci_high: 0.0, unplanned_share_ci_low: null, unplanned_share_ci_high: null}
        - {grain: cell, line: "2", direction_id: 0, n_replicates: 2, n_share_replicates: 1, missed_rate_ci_low: 0.005000000000000001, missed_rate_ci_high: 0.195, unplanned_share_ci_low: 0.5, unplanned_share_ci_high: 0.5}

  - name: fct_reliability_and_system_summary_take_their_own_grain_intervals
    model: fct_reliability
    overrides:
      vars: {min_cell_trips: 2, min_cell_service_days_weekday: 2, min_cell_service_days_weekend: 99}
    given:
      - input: ref('int_trip_cells')
        rows:
          - {service_date: "2026-12-31", trip_id: a, line: "1", direction_id: 0, day_type: weekday, hour_local: 8, outcome: ran, announced: false}
          - {service_date: "2026-12-30", trip_id: b, line: "1", direction_id: 0, day_type: weekday, hour_local: 8, outcome: missed, announced: false}
          # A cell with no misses: no interval even if one exists.
          - {service_date: "2026-12-31", trip_id: c, line: "1", direction_id: 0, day_type: weekday, hour_local: 9, outcome: ran, announced: false}
          - {service_date: "2026-12-30", trip_id: d, line: "1", direction_id: 0, day_type: weekday, hour_local: 9, outcome: ran, announced: false}
      - input: ref('int_windows')
        rows:
          - {time_window: "28d", window_start: "2026-12-04", window_end: "2026-12-31"}
      - input: ref('int_bootstrap_intervals')
        rows:
          - {grain: cell, time_window: "28d", line: "1", direction_id: 0, day_type: weekday, hour_local: 8, missed_rate_ci_low: 0.1, missed_rate_ci_high: 0.9}
          - {grain: cell, time_window: "28d", line: "1", direction_id: 0, day_type: weekday, hour_local: 9, missed_rate_ci_low: 0.0, missed_rate_ci_high: 0.0}
          # Another grain's row with the same line and direction must not be picked up.
          - {grain: line_direction, time_window: "28d", line: "1", direction_id: 0, day_type: null, hour_local: null, missed_rate_ci_low: 0.3, missed_rate_ci_high: 0.4}
    expect:
      rows:
        - {hour_local: 8, suppressed: false, ci_low: 0.1, ci_high: 0.9}
        - {hour_local: 9, suppressed: false, ci_low: null, ci_high: null}

