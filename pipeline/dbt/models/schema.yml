  - name: int_feed_health_5min_marks_quiet_and_stale_buckets_unhealthy
    model: int_feed_health_5min
    given:
      - input: ref('src_sync_range')
        rows:
          - {start: "2026-11-15", end: "2026-11-15"}
      - input: ref('stg_fetch_log')
        rows:
          # 16:00: a fresh success. 16:05: only a stale success (200 s old). 16:10: only an
          # error. 16:15: nothing at all.
          - {feed: vehicle_positions, fetched_at: "2026-11-15 16:00:30+00", outcome: written, feed_header_ts: "2026-11-15 16:00:20+00"}
          - {feed: vehicle_positions, fetched_at: "2026-11-15 16:05:30+00", outcome: written, feed_header_ts: "2026-11-15 16:02:10+00"}
          - {feed: vehicle_positions, fetched_at: "2026-11-15 16:10:30+00", outcome: network_error, feed_header_ts: null}
          # 16:20: a stale written and a fresh duplicate: the freshest success decides.
          - {feed: vehicle_positions, fetched_at: "2026-11-15 16:20:10+00", outcome: written, feed_header_ts: "2026-11-15 16:15:00+00"}
          - {feed: vehicle_positions, fetched_at: "2026-11-15 16:20:40+00", outcome: duplicate, feed_header_ts: "2026-11-15 16:20:30+00"}
          # 16:25: exactly 180 s old: not under the limit.
          - {feed: vehicle_positions, fetched_at: "2026-11-15 16:28:00+00", outcome: written, feed_header_ts: "2026-11-15 16:25:00+00"}
          - {feed: gtfs_static, fetched_at: "2026-11-15 16:00:30+00", outcome: written, feed_header_ts: null}
    expect:
      format: sql
      rows: |
        -- Every bucket of the synced UTC days (Nov 14-16), both feeds: quiet unless listed.
        select f.feed, b.bucket_start,
               coalesce(o.n_fetches, 0) as n_fetches, coalesce(o.n_success, 0) as n_success,
               o.freshest_age_s, coalesce(o.healthy, false) as healthy,
               cast(b.bucket_start at time zone 'UTC' as date) <> date '2026-11-15' as is_padding
        from generate_series(timestamptz '2026-11-14 00:00:00+00',
                             timestamptz '2026-11-16 23:55:00+00', interval 5 minute) as b(bucket_start)
        cross join (values ('vehicle_positions'), ('trip_updates')) as f(feed)
        left join (values
            ('vehicle_positions', timestamptz '2026-11-15 16:00:00+00', 1, 1, 10.0, true),
            ('vehicle_positions', timestamptz '2026-11-15 16:05:00+00', 1, 1, 200.0, false),
            ('vehicle_positions', timestamptz '2026-11-15 16:10:00+00', 1, 0, null, false),
            ('vehicle_positions', timestamptz '2026-11-15 16:20:00+00', 2, 2, 10.0, true),
            ('vehicle_positions', timestamptz '2026-11-15 16:25:00+00', 1, 1, 180.0, false)
        ) as o(feed, bucket_start, n_fetches, n_success, freshest_age_s, healthy)
            using (feed, bucket_start)

