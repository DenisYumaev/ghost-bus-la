  - name: int_service_dates_picks_the_version_in_force_across_a_service_change
    model: int_service_dates
    given:
      - input: ref('src_sync_range')
        rows:
          - {start: "2026-11-14", end: "2026-12-14"}
      - input: ref('dim_schedule_version')
        rows:
          - {version_id: A, valid_from: "2026-11-15", valid_to: "2026-12-12"}
          - {version_id: B, valid_from: "2026-12-13", valid_to: null}
          - {version_id: X, valid_from: "2026-11-20", valid_to: "2026-11-19"}
    expect:
      format: sql
      rows: |
        select service_date, schedule_version, iso_dow from (values
          (date '2026-11-14', null, 6),
          (date '2026-11-15', 'A', 7)
        ) as t(service_date, schedule_version, iso_dow)
        union all
        select cast(d as date), 'A', isodow(cast(d as date))
        from generate_series(date '2026-11-16', date '2026-12-12', interval 1 day) as g(d)
        union all
        select cast(d as date), 'B', isodow(cast(d as date))
        from generate_series(date '2026-12-13', date '2026-12-14', interval 1 day) as g(d)

  - name: int_schedule_expanded_applies_calendar_and_exceptions_and_the_time_rule
    model: int_schedule_expanded
    given:
      - input: ref('int_service_dates')
        rows:
          - {service_date: "2026-11-15", schedule_version: v, iso_dow: 7}
          - {service_date: "2026-11-16", schedule_version: v, iso_dow: 1}
          - {service_date: "2026-12-20", schedule_version: v, iso_dow: 7}
          - {service_date: "2026-11-14", schedule_version: null, iso_dow: 6}
          - {service_date: "2026-12-06", schedule_version: v, iso_dow: 7}
          - {service_date: "2026-12-13", schedule_version: v2, iso_dow: 7}
      - input: ref('dim_calendar')
        rows:
          - {schedule_version: v, service_id: SUN, monday: 0, tuesday: 0, wednesday: 0, thursday: 0, friday: 0, saturday: 0, sunday: 1, start_date: "2026-06-07", end_date: "2026-12-06"}
          - {schedule_version: v, service_id: WK, monday: 1, tuesday: 1, wednesday: 1, thursday: 1, friday: 1, saturday: 0, sunday: 0, start_date: "2026-06-07", end_date: "2026-12-12"}
          - {schedule_version: v2, service_id: SUN, monday: 0, tuesday: 0, wednesday: 0, thursday: 0, friday: 0, saturday: 0, sunday: 1, start_date: "2026-12-13", end_date: "2027-06-01"}
      - input: ref('dim_calendar_dates')
        rows:
          # Added on a date its weekly calendar already covers: still one row.
          - {schedule_version: v, service_id: SUN, service_date: "2026-11-15", exception_type: 1}
          - {schedule_version: v, service_id: WK, service_date: "2026-11-16", exception_type: 2}
          - {schedule_version: v, service_id: HOL, service_date: "2026-11-15", exception_type: 1}
      - input: ref('dim_trips')
        rows:
          - {schedule_version: v, trip_id: T1, route_id: R, service_id: SUN, direction_id: 0, block_id: "B1"}
          - {schedule_version: v, trip_id: T2, route_id: R, service_id: WK, direction_id: 1, block_id: "B1"}
          - {schedule_version: v, trip_id: T3, route_id: R, service_id: HOL, direction_id: 0, block_id: null}
          # Metro reuses trip IDs across weekly versions: v2's T1 has its own times.
          - {schedule_version: v2, trip_id: T1, route_id: R, service_id: SUN, direction_id: 0, block_id: "B9"}
      - input: ref('dim_stop_times')
        rows:
          - {schedule_version: v, trip_id: T1, stop_sequence: 1, stop_id: "A", arrival_s: 90600, departure_s: 90600}
          - {schedule_version: v, trip_id: T1, stop_sequence: 2, stop_id: "B", arrival_s: 92400, departure_s: null}
          - {schedule_version: v, trip_id: T2, stop_sequence: 1, stop_id: "A", arrival_s: 30000, departure_s: 30000}
          - {schedule_version: v, trip_id: T3, stop_sequence: 1, stop_id: "C", arrival_s: null, departure_s: 28800}
          - {schedule_version: v, trip_id: T3, stop_sequence: 2, stop_id: "D", arrival_s: 30600, departure_s: 30600}
          - {schedule_version: v2, trip_id: T1, stop_sequence: 1, stop_id: "E", arrival_s: 36000, departure_s: 36000}
      - input: ref('dim_routes')
        rows:
          - {schedule_version: v, route_id: R, line: "2"}
          - {schedule_version: v2, route_id: R, line: "2"}
    expect:
      rows:
        # Nov 15 is a Sunday: T1 runs, at 25:10 = 01:10 PST Nov 16 = 09:10 UTC Nov 16.
        - {service_date: "2026-11-15", schedule_version: v, trip_id: T1, line: "2", block_id: "B1", first_stop_id: "A", n_stops: 2, sched_start_utc: "2026-11-16 09:10:00+00", sched_end_utc: "2026-11-16 09:40:00+00"}
        # HOL runs only because calendar_dates adds it on Nov 15.
        - {service_date: "2026-11-15", schedule_version: v, trip_id: T3, line: "2", block_id: null, first_stop_id: "C", n_stops: 2, sched_start_utc: "2026-11-15 16:00:00+00", sched_end_utc: "2026-11-15 16:30:00+00"}
        # Dec 6 is SUN's end_date (inclusive) and a Sunday: T1 runs.
        - {service_date: "2026-12-06", schedule_version: v, trip_id: T1, line: "2", block_id: "B1", first_stop_id: "A", n_stops: 2, sched_start_utc: "2026-12-07 09:10:00+00", sched_end_utc: "2026-12-07 09:40:00+00"}
        # Dec 13 is in v2: v2's T1 with v2's time (10:00 PST), never v's.
        - {service_date: "2026-12-13", schedule_version: v2, trip_id: T1, line: "2", block_id: "B9", first_stop_id: "E", n_stops: 1, sched_start_utc: "2026-12-13 18:00:00+00", sched_end_utc: "2026-12-13 18:00:00+00"}
        # Nov 16 (Monday): WK is removed by calendar_dates, so T2 doesn't run.
        # Dec 20 (Sunday): past SUN's end_date, so nothing runs. Nov 14: no version.

  - name: int_trip_crosswalk_matches_exactly_against_each_dates_version
    model: int_trip_crosswalk
    given:
      - input: ref('stg_trip_reports')
        rows:
          - {trip_id: T1, service_date: "2026-12-12"}
          - {trip_id: T1, service_date: "2026-12-13"}
          - {trip_id: OLD1, service_date: "2026-12-13"}
          - {trip_id: GHOST, service_date: "2026-12-12"}
          - {trip_id: T1, service_date: "2026-12-20"}
      - input: ref('stg_vehicle_positions')
        rows:
          - {trip_id: T1, service_date: "2026-12-12"}
          - {trip_id: null, service_date: null}
      - input: ref('int_schedule_expanded')
        rows:
          # Dec 12 is in version v1, Dec 13 in v2; Metro reuses T1 in both. OLD1 exists only
          # in v1, so on a v2 date it must not match.
          - {service_date: "2026-12-12", schedule_version: v1, trip_id: T1}
          - {service_date: "2026-12-12", schedule_version: v1, trip_id: OLD1}
          - {service_date: "2026-12-13", schedule_version: v2, trip_id: T1}
      - input: ref('int_service_dates')
        rows:
          - {service_date: "2026-12-12", schedule_version: v1}
          - {service_date: "2026-12-13", schedule_version: v2}
    expect:
      rows:
        - {trip_id: T1, service_date: "2026-12-12", sources: [trip_updates, vehicle_positions], schedule_version: v1, scheduled_trip_id: T1, match_method: exact, in_scope: true}
        - {trip_id: T1, service_date: "2026-12-13", sources: [trip_updates], schedule_version: v2, scheduled_trip_id: T1, match_method: exact, in_scope: true}
        - {trip_id: OLD1, service_date: "2026-12-13", sources: [trip_updates], schedule_version: null, scheduled_trip_id: null, match_method: unmatched, in_scope: true}
        - {trip_id: GHOST, service_date: "2026-12-12", sources: [trip_updates], schedule_version: null, scheduled_trip_id: null, match_method: unmatched, in_scope: true}
        # Outside the synced range: not evidence of a matching problem.
        - {trip_id: T1, service_date: "2026-12-20", sources: [trip_updates], schedule_version: null, scheduled_trip_id: null, match_method: unmatched, in_scope: false}

  - name: int_trip_observations_uses_the_crosswalk_window_chosen_reports_and_the_start_cutoff
    model: int_trip_observations
    given:
      - input: ref('int_schedule_expanded')
        rows:
          # Each trip runs 16:00-17:00 UTC on Nov 15; window 15:30-18:00.
          - {service_date: "2026-11-15", schedule_version: v, trip_id: A, n_stops: 10, sched_start_utc: "2026-11-15 16:00:00+00", sched_end_utc: "2026-11-15 17:00:00+00"}
          - {service_date: "2026-11-15", schedule_version: v, trip_id: B, n_stops: 10, sched_start_utc: "2026-11-15 16:00:00+00", sched_end_utc: "2026-11-15 17:00:00+00"}
          - {service_date: "2026-11-15", schedule_version: v, trip_id: C, n_stops: 10, sched_start_utc: "2026-11-15 16:00:00+00", sched_end_utc: "2026-11-15 17:00:00+00"}
          - {service_date: "2026-11-15", schedule_version: v, trip_id: D, n_stops: 10, sched_start_utc: "2026-11-15 16:00:00+00", sched_end_utc: "2026-11-15 17:00:00+00"}
          - {service_date: "2026-11-15", schedule_version: v, trip_id: E, n_stops: 10, sched_start_utc: "2026-11-15 16:00:00+00", sched_end_utc: "2026-11-15 17:00:00+00"}
          - {service_date: "2026-11-15", schedule_version: v, trip_id: F, n_stops: 10, sched_start_utc: "2026-11-15 16:00:00+00", sched_end_utc: "2026-11-15 17:00:00+00"}
      - input: ref('int_trip_crosswalk')
        rows:
          - {trip_id: A, service_date: "2026-11-15", schedule_version: v, scheduled_trip_id: A, match_method: exact}
          - {trip_id: B, service_date: "2026-11-15", schedule_version: v, scheduled_trip_id: B, match_method: exact}
          - {trip_id: C, service_date: "2026-11-15", schedule_version: v, scheduled_trip_id: C, match_method: exact}
          - {trip_id: D, service_date: "2026-11-15", schedule_version: v, scheduled_trip_id: D, match_method: exact}
          - {trip_id: E, service_date: "2026-11-15", schedule_version: v, scheduled_trip_id: E, match_method: exact}
          - {trip_id: F, service_date: "2026-11-15", schedule_version: v, scheduled_trip_id: F, match_method: exact}
          - {trip_id: A, service_date: "2026-11-14", schedule_version: null, scheduled_trip_id: null, match_method: unmatched}
      - input: ref('stg_vehicle_positions')
        rows:
          # A: one before the window (ignored), one waiting before the start, one after it.
          - {trip_id: A, service_date: "2026-11-15", vehicle_id: "7", vehicle_ts: "2026-11-15 15:29:59+00", first_fetched_at: "2026-11-15 15:30:10+00", current_stop_sequence: 1, trip_schedule_relationship: SCHEDULED, n_trips: 1}
          - {trip_id: A, service_date: "2026-11-15", vehicle_id: "7", vehicle_ts: "2026-11-15 15:45:00+00", first_fetched_at: "2026-11-15 15:45:10+00", current_stop_sequence: 1, trip_schedule_relationship: SCHEDULED, n_trips: 1}
          - {trip_id: A, service_date: "2026-11-15", vehicle_id: "7", vehicle_ts: "2026-11-15 16:40:00+00", first_fetched_at: "2026-11-15 16:40:10+00", current_stop_sequence: 9, trip_schedule_relationship: SCHEDULED, n_trips: 2}
          # Same trip_id, another service date, inside the UTC window: not A's.
          - {trip_id: A, service_date: "2026-11-14", vehicle_id: "6", vehicle_ts: "2026-11-15 16:30:00+00", first_fetched_at: "2026-11-15 16:30:10+00", current_stop_sequence: 5, trip_schedule_relationship: SCHEDULED, n_trips: 1}
          # B: only after the window ends. F: a position whose descriptor says CANCELED.
          - {trip_id: B, service_date: "2026-11-15", vehicle_id: "8", vehicle_ts: "2026-11-15 18:00:01+00", first_fetched_at: "2026-11-15 18:00:10+00", current_stop_sequence: 5, trip_schedule_relationship: SCHEDULED, n_trips: 1}
          - {trip_id: F, service_date: "2026-11-15", vehicle_id: "9", vehicle_ts: "2026-11-15 16:10:00+00", first_fetched_at: "2026-11-15 16:10:10+00", current_stop_sequence: 2, trip_schedule_relationship: CANCELED, n_trips: 1}
      - input: ref('stg_trip_reports')
        rows:
          # B: chosen SCHEDULED with a vehicle in the window; another after it (ignored).
          - {trip_id: B, service_date: "2026-11-15", fetched_at: "2026-11-15 16:10:00+00", is_chosen: true, trip_schedule_relationship: SCHEDULED, vehicle_id: "8"}
          - {trip_id: B, service_date: "2026-11-15", fetched_at: "2026-11-15 18:00:01+00", is_chosen: true, trip_schedule_relationship: SCHEDULED, vehicle_id: "8"}
          # C: a NON-chosen SCHEDULED report with a vehicle (stale duplicate), and the chosen
