  - name: fct_reliability_counts_rates_windows_and_suppression
    model: fct_reliability
    overrides:
      # Small thresholds, set apart so each can be failed alone (C3: trips, C4: weekday days,
      # C6: weekend days).
      vars: {min_cell_trips: 3, min_cell_service_days_weekday: 2, min_cell_service_days_weekend: 1}
    given:
      # C1: line 1 dir 0, weekday 08:00: Dec 31 ran, announced miss, unplanned miss, unknown;
      # Dec 30 ran, partial; Nov 2 (90d) unplanned miss, ran though announced; Aug 3 (all)
      # announced miss. C2: a 25:30 trip, hour 1. C3: dir 1 08:00, 2 trips on 2 days (too few
      # trips). C4: dir 1 09:00, 3 trips on one day plus an unknown-only day (too few days).
      # C5: Saturday hour 2 (90d and all only). C6: Saturday 09:00, 3 trips on one day.
      - input: ref('int_trip_cells')
        rows:
          - {service_date: "2026-12-31", trip_id: a1, line: "1", direction_id: 0, day_type: weekday, hour_local: 8, outcome: ran, announced: false}
          - {service_date: "2026-12-31", trip_id: a2, line: "1", direction_id: 0, day_type: weekday, hour_local: 8, outcome: missed, announced: true}
          - {service_date: "2026-12-31", trip_id: a3, line: "1", direction_id: 0, day_type: weekday, hour_local: 8, outcome: missed, announced: false}
          - {service_date: "2026-12-31", trip_id: a4, line: "1", direction_id: 0, day_type: weekday, hour_local: 8, outcome: unknown, announced: false}
          - {service_date: "2026-12-31", trip_id: a5, line: "1", direction_id: 0, day_type: weekday, hour_local: 1, outcome: ran, announced: false}
          - {service_date: "2026-12-30", trip_id: b1, line: "1", direction_id: 0, day_type: weekday, hour_local: 8, outcome: ran, announced: false}
          - {service_date: "2026-12-30", trip_id: b2, line: "1", direction_id: 0, day_type: weekday, hour_local: 8, outcome: partial, announced: true}
          - {service_date: "2026-11-02", trip_id: c1, line: "1", direction_id: 0, day_type: weekday, hour_local: 8, outcome: missed, announced: false}
          - {service_date: "2026-11-02", trip_id: c2, line: "1", direction_id: 0, day_type: weekday, hour_local: 8, outcome: ran, announced: true}
