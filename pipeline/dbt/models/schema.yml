version: 2

# Grain tests (unique_combination) also fail on a NULL key. Links between GTFS tables hold
# within one schedule version, so they're composite (relationship_combination).

models:
  - name: stg_fetch_log
    description: One row per fetch attempt; identical lines from re-uploaded hour files collapse.
    columns:
      - name: fetch_key
        data_tests: [unique, not_null]
      - name: feed
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [vehicle_positions, trip_updates, gtfs_static]}
      - name: fetched_at
        data_tests: [not_null]
      - name: outcome
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [written, duplicate, network_error, spool_error, http_error]

  - name: dim_schedule_version
    columns:
      - name: version_id
        data_tests: [unique, not_null]
      - name: valid_from
        data_tests: [not_null]

  - name: dim_routes
    data_tests:
      - unique_combination:
          arguments: {columns: [schedule_version, route_id]}
    columns:
      - name: line
        data_tests: [not_null]

  - name: dim_trips
    data_tests:
      - unique_combination:
          arguments: {columns: [schedule_version, trip_id]}
      - relationship_combination:
          arguments:
            columns: [schedule_version, route_id]
            to: ref('dim_routes')
            to_columns: [schedule_version, route_id]
    columns:
      - name: service_id
        data_tests: [not_null]
      - name: route_id
        data_tests: [not_null]
      - name: direction_id
        data_tests:
          - accepted_values:
              arguments: {values: [0, 1]}

  - name: dim_stops
    data_tests:
      - unique_combination:
          arguments: {columns: [schedule_version, stop_id]}

  - name: dim_stop_times
    data_tests:
      - unique_combination:
          arguments: {columns: [schedule_version, trip_id, stop_sequence]}
      - relationship_combination:
          arguments:
            columns: [schedule_version, trip_id]
            to: ref('dim_trips')
            to_columns: [schedule_version, trip_id]
      - relationship_combination:
          arguments:
            columns: [schedule_version, stop_id]
            to: ref('dim_stops')
            to_columns: [schedule_version, stop_id]

  - name: dim_calendar
    data_tests:
      - unique_combination:
          arguments: {columns: [schedule_version, service_id]}
    columns:
      - name: start_date
        data_tests: [not_null]
      - name: end_date
        data_tests: [not_null]
      - name: monday
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [0, 1]}
      - name: tuesday
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [0, 1]}
      - name: wednesday
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [0, 1]}
      - name: thursday
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [0, 1]}
      - name: friday
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [0, 1]}
      - name: saturday
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [0, 1]}
      - name: sunday
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [0, 1]}

  - name: dim_calendar_dates
    data_tests:
      - unique_combination:
          arguments: {columns: [schedule_version, service_id, service_date]}
    columns:
      - name: exception_type
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [1, 2]}

  - name: stg_vehicle_positions
    description: One row per vehicle report (vehicle_id, vehicle_ts), first sighting kept.
    data_tests:
      - unique_combination:
          arguments: {columns: [vehicle_id, vehicle_ts]}
    columns:
      - name: first_fetched_at
        data_tests: [not_null]
      - name: lat
        data_tests: [not_null]
      - name: lon
        data_tests: [not_null]
      - name: direction_id
        data_tests:
          - accepted_values:
              arguments: {values: [0, 1]}

  - name: stg_trip_reports
    description: One row per trip report (trip, service date, fetch, entity); is_chosen marks the newest per trip-fetch.
    data_tests:
      - unique_combination:
          arguments: {columns: [trip_id, service_date, fetched_at, entity_key]}
    columns:
      - name: report_ts
        data_tests: [not_null]
      - name: trip_schedule_relationship
        data_tests:
          - accepted_values:
              arguments:
                values: [SCHEDULED, CANCELED, ADDED, UNSCHEDULED, DUPLICATED, DELETED,
                         NEW, REPLACEMENT]
              config: {severity: warn}

  - name: stg_trip_updates
    description: Stop predictions of the chosen report per trip-fetch.
    data_tests:
      # Checked on the last synced service date only: the grain is built per trip-fetch, so one
      # day exercises it fully, and over every synced day the near-unique keys made the test
      # the build's biggest memory user (out of memory at 4 GB with two service dates synced,
      # about 170M rows; 2026-11-18). A day's volume is fixed, so this stays bounded.
      - unique_combination:
          arguments: {columns: [trip_id, service_date, fetched_at, stop_key, stop_id_key]}
          config:
            where: "service_date = (select cast(\"end\" as date) from src_sync_range)"

  - name: stg_cancellations
    description: One row per trip x service date ever marked CANCELED in trip updates.
    data_tests:
      - unique_combination:
          arguments: {columns: [trip_id, service_date]}
    columns:
      - name: first_seen_at
        data_tests: [not_null]
      - name: reinstated
        data_tests: [not_null]

  - name: int_service_dates
    description: One row per service date in the synced range, with the schedule version in force.
    columns:
      - name: service_date
        data_tests: [unique, not_null]

  - name: int_schedule_expanded
    description: One row per scheduled trip per service date, from the version in force.
    data_tests:
      - unique_combination:
          arguments: {columns: [service_date, schedule_version, trip_id]}
      - relationship_combination:
          arguments:
            columns: [schedule_version, trip_id]
            to: ref('dim_trips')
            to_columns: [schedule_version, trip_id]
    columns:
      - name: sched_start_utc
        data_tests: [not_null]
      - name: sched_end_utc
        data_tests: [not_null]
      - name: line
        data_tests: [not_null]

  - name: int_trip_crosswalk
    description: One row per realtime trip key (trip_id, service_date), matched exactly or not.
    data_tests:
      - unique_combination:
          arguments: {columns: [trip_id, service_date]}
    columns:
      - name: match_method
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [exact, unmatched]}

  - name: int_trip_observations
    description: One row per scheduled trip per service date with what the feeds showed in its window.
    data_tests:
      - unique_combination:
          arguments: {columns: [service_date, schedule_version, trip_id]}
    columns:
      - name: observed_running
        data_tests: [not_null]
      - name: rt_canceled
        data_tests: [not_null]

  - name: int_feed_health_5min
    description: One row per realtime feed per 5-minute bucket over the synced UTC days.
    data_tests:
      - unique_combination:
          arguments: {columns: [feed, bucket_start]}

  - name: fct_feed_health
    description: Feed freshness, fetch error rate and healthy flag per 5 minutes.
    data_tests:
      - unique_combination:
          arguments: {columns: [feed, bucket_start]}

  - name: fct_trip_outcomes
    description: One outcome per scheduled trip per service date (ADR-024).
    data_tests:
      - unique_combination:
          arguments: {columns: [service_date, schedule_version, trip_id]}
      # One schedule version per service date, so the API's trip list can page by
      # (sched_start_utc, trip_id) without two rows sharing a key.
      - unique_combination:
          arguments: {columns: [service_date, trip_id]}
    columns:
      - name: sched_start_utc
        data_tests: [not_null]
      - name: line
        data_tests: [not_null]
      - name: outcome
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [ran, partial, unknown, missed]}
      - name: announced
        data_tests: [not_null]
      - name: feed_healthy_share
        data_tests: [not_null]

  - name: int_service_day_types
    description: >
      One row per service date with its day type (weekday, saturday, sunday): the calendar
      pattern most of that date's scheduled trips come from, so a holiday on Sunday service is
      a sunday. Falls back to the calendar day when no trip has a classified pattern.
    columns:
      - name: service_date
        data_tests: [unique, not_null]
      - name: day_type
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [weekday, saturday, sunday]}
      - name: day_type_source
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [schedule, calendar]}

  - name: fct_reliability
    description: >
      Trip counts and rates per line x direction x day type x local hour of scheduled start x
      window (pipeline spec sections 6.3, 8, 9). Windows end at the last service date with
      outcomes. Cells under min_cell_trips trips or the day type's minimum service days are
      suppressed (ADR-025).
    data_tests:
      - unique_combination:
          arguments: {columns: [line, direction_id, day_type, hour_local, time_window]}
    columns:
      - name: time_window
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ["28d", "90d", "all"]}
      - name: day_type
        data_tests: [not_null]
      - name: hour_local
        data_tests: [not_null]
      - name: suppressed
        data_tests: [not_null]

  - name: int_line_trip_stops
    description: >
      One row per stop visit of every trip in every schedule version ever in force:
      (schedule_version, trip_id, stop_sequence), with line, direction, pattern and the visit's
      position on the main pattern's scale. Feeds the line tables.
    data_tests:
      - unique_combination:
          arguments: {columns: [schedule_version, trip_id, stop_sequence]}
    columns:
      - name: anchor_position
        data_tests: [not_null]

  - name: dim_line
    description: One row per line with trips, per schedule version ever in force.
    data_tests:
      - unique_combination:
          arguments: {columns: [schedule_version, line]}
      - unique_combination:
          arguments: {columns: [schedule_version, line_slug]}
    columns:
      - name: display_name
        data_tests: [not_null]

  - name: dim_line_direction
    description: >
      One row per line x direction per version: headsign (most common first-stop stop_headsign,
      line prefix removed except on combined lines) and the main pattern's first and last stops.
    data_tests:
      - unique_combination:
          arguments: {columns: [schedule_version, line, direction_id]}
      - relationship_combination:
          arguments: {to: ref('dim_line'), columns: [schedule_version, line], to_columns: [schedule_version, line]}
    columns:
      - name: headsign
        data_tests: [not_null]
      - name: first_stop_name
        data_tests: [not_null]
      - name: last_stop_name
        data_tests: [not_null]

  - name: dim_line_stop
    description: >
      One row per stop any trip of a line x direction serves, per version, in route order
      (stop_order 1..n on the main pattern's scale). For stop pickers and commute validation.
    data_tests:
      - unique_combination:
          arguments: {columns: [schedule_version, line, direction_id, stop_id]}
      - unique_combination:
          arguments: {columns: [schedule_version, line, direction_id, stop_order]}
      - relationship_combination:
          arguments: {to: ref('dim_line_direction'), columns: [schedule_version, line, direction_id], to_columns: [schedule_version, line, direction_id]}
    columns:
      - name: stop_name
        data_tests: [not_null]

  - name: int_trip_cells
    description: Trips with outcomes in the reliability scope, with day type and local hour.
    data_tests:
      - unique_combination:
          arguments: {columns: [service_date, schedule_version, trip_id]}
    columns:
      - name: hour_local
        data_tests: [not_null]
      - name: line
        data_tests: [not_null]
      - name: day_type
        data_tests: [not_null]
      - name: outcome
        data_tests: [not_null]

  - name: int_windows
    description: The 28d, 90d and all windows, anchored on the last service date with outcomes.
    columns:
      - name: time_window
        data_tests: [unique, not_null]

  - name: fct_system_summary
    description: Headline counts and rates per window for the home page (same trips as fct_reliability).
    columns:
      - name: time_window
        data_tests: [unique, not_null]
      - name: suppressed
        data_tests: [not_null]

  - name: fct_line_trend
    description: Weekly counts and rates per line x direction (week_start = Monday).
    data_tests:
      - unique_combination:
          arguments: {columns: [line, direction_id, week_start]}
    columns:
      - name: suppressed
        data_tests: [not_null]

  - name: fct_line_summary
    description: >
      Counts and rates per line x direction x window, plus a both-directions row per line x
      window (direction_id NULL). Uniqueness: tests/line_summary_has_one_row_per_key.sql.
    columns:
      - name: line
        data_tests: [not_null]
      - name: time_window
        data_tests: [not_null]
      - name: suppressed
        data_tests: [not_null]

  - name: int_bootstrap_weights
    description: Bootstrap draws of service dates per window x replicate, stratified by day type (ADR-027).
    data_tests:
      - unique_combination:
          arguments: {columns: [time_window, replicate, service_date]}
    columns:
      - name: weight
        data_tests: [not_null]

  - name: int_bootstrap_replicates
    description: Re-weighted counts per grain x window x replicate x key (ADR-027).
    columns:
      - name: grain
        data_tests: [not_null]

  - name: int_bootstrap_intervals
    description: 95% bootstrap intervals per grain x window x key. Validity in tests/bootstrap_intervals_are_valid.sql.
    columns:
      - name: grain
        data_tests: [not_null]
      - name: time_window
        data_tests: [not_null]

  - name: dim_method_params
    description: The thresholds of this build, for the method page (rendered from dbt vars).
    columns:
      - name: name
        data_tests: [unique, not_null]

  - name: dim_method_params_nightly
    description: The bootstrap's settings, rebuilt with the intervals (tag nightly).
    columns:
      - name: name
        data_tests: [unique, not_null]

  - name: fct_current_cancellations
    description: Trips still canceled at the newest trip-update fetch (ADR-029).
    data_tests:
      - unique_combination:
          arguments: {columns: [service_date, trip_id]}
    columns:
      - name: as_of
        data_tests: [not_null]
      - name: line
        data_tests: [not_null]
      - name: sched_start_utc
        data_tests: [not_null]
      - name: sched_end_utc
        data_tests: [not_null]
      - name: canceled_first_seen_at
        data_tests: [not_null]

  - name: fct_current_cancellations_as_of
    description: The newest trip-update fetch the decoded state covers (one row).

unit_tests:
  - name: stg_fetch_log_collapses_repeated_lines_and_keeps_only_fetches
    model: stg_fetch_log
    given:
      - input: ref('src_fetch_log')
        rows:
          - {event: fetch, feed: vehicle_positions, fetched_at: "2026-11-14T05:00:00Z", outcome: written}
          - {event: fetch, feed: vehicle_positions, fetched_at: "2026-11-14T05:00:00Z", outcome: written}
          - {event: disconnect, feed: vehicle_positions}
          - {event: fetch, feed: trip_updates, fetched_at: "2026-11-14T05:01:00.400Z", outcome: network_error}
    expect:
      rows:
        # In UTC whatever the session zone: test_dbt.py runs dbt in Los Angeles time.
        - {fetch_key: "vehicle_positions@2026-11-14T05:00:00.000000", outcome: written}
        - {fetch_key: "trip_updates@2026-11-14T05:01:00.400000", outcome: network_error}

  - name: dim_trips_treats_a_blank_block_id_as_none
    model: dim_trips
    given:
      - input: ref('src_gtfs_trips')
        rows:
          - {schedule_version: v1, trip_id: T1, route_id: R, service_id: S, block_id: "2065100"}
          - {schedule_version: v1, trip_id: T2, route_id: R, service_id: S, block_id: "  "}
          - {schedule_version: v1, trip_id: T3, route_id: R, service_id: S, block_id: null}
    expect:
      rows:
        - {trip_id: T1, block_id: "2065100"}
        - {trip_id: T2, block_id: null}
        - {trip_id: T3, block_id: null}

  - name: dim_routes_falls_back_to_the_route_number_for_lines_without_a_short_name
    model: dim_routes
    given:
      - input: ref('src_gtfs_routes')
        rows:
          - {schedule_version: v1, route_id: "2-13201", route_short_name: "2"}
          - {schedule_version: v1, route_id: "901-13201", route_short_name: null}
          - {schedule_version: v1, route_id: "910-13201", route_short_name: "  "}
          - {schedule_version: v1, route_id: "R7", route_short_name: ""}
          - {schedule_version: v1, route_id: "854-13201", route_short_name: " Dodger Stadium Express "}
    expect:
      rows:
        - {route_id: "2-13201", line: "2"}
        - {route_id: "901-13201", line: "901"}
        - {route_id: "910-13201", line: "910"}
        - {route_id: "R7", line: "R7"}
        - {route_id: "854-13201", line: "Dodger Stadium Express"}

  - name: stg_vehicle_positions_keeps_the_first_sighting_of_each_report
    model: stg_vehicle_positions
    given:
      - input: ref('src_vehicle_position')
        rows:
          # Two entities for one vehicle report in one snapshot (same fetch): one sighting,
          # chosen by the total order (entity_id), and counted as one snapshot.
          - {vehicle_id: "1", vehicle_ts: "2026-11-15 16:00:00+00", fetched_at: "2026-11-15 16:00:00+00", snapshot_sha: a, entity_id: e2, lat: 34.1, lon: -118.1}
          - {vehicle_id: "1", vehicle_ts: "2026-11-15 16:00:00+00", fetched_at: "2026-11-15 16:00:00+00", snapshot_sha: a, entity_id: e1, lat: 34.1, lon: -118.0}
          - {vehicle_id: "1", vehicle_ts: "2026-11-15 16:00:00+00", fetched_at: "2026-11-15 16:00:30+00", snapshot_sha: b, entity_id: e1, lat: 34.1, lon: -118.0}
          - {vehicle_id: "1", vehicle_ts: "2026-11-15 16:00:20+00", fetched_at: "2026-11-15 16:01:00+00", snapshot_sha: c, entity_id: e1, lat: 34.3, lon: -118.0, trip_schedule_relationship: null}
    expect:
      rows:
        - {vehicle_ts: "2026-11-15 16:00:00+00", entity_id: e1, lat: 34.1, lon: -118.0, n_snapshots: 2}
        - {vehicle_ts: "2026-11-15 16:00:20+00", entity_id: e1, lat: 34.3, lon: -118.0, n_snapshots: 1}

  - name: stg_trip_reports_chooses_the_newest_report_per_trip_fetch
    model: stg_trip_reports
    given:
      - input: ref('src_trip_update')
        rows:
          # Fetch 1: stale CANCELED (no vehicle, older) vs newer SCHEDULED with two stops.
          - {trip_id: A, start_date: "2026-11-15", fetched_at: "2026-11-15 10:00:00+00", entity_id: a1, entity_ts: "2026-11-15 09:59:00+00", trip_schedule_relationship: CANCELED}
          - {trip_id: A, start_date: "2026-11-15", fetched_at: "2026-11-15 10:00:00+00", entity_id: a2, entity_ts: "2026-11-15 09:59:40+00", vehicle_id: "5898", stop_sequence: 5}
          - {trip_id: A, start_date: "2026-11-15", fetched_at: "2026-11-15 10:00:00+00", entity_id: a2, entity_ts: "2026-11-15 09:59:40+00", vehicle_id: "5898", stop_sequence: 6}
          # Fetch 2: a single older report must survive (the partition is per fetch).
          - {trip_id: A, start_date: "2026-11-15", fetched_at: "2026-11-15 10:01:00+00", entity_id: a1, entity_ts: "2026-11-15 09:59:00+00", trip_schedule_relationship: CANCELED}
          # Same trip on the next service date, same fetch: its own partition.
          - {trip_id: A, start_date: "2026-11-16", fetched_at: "2026-11-15 10:00:00+00", entity_id: a3, entity_ts: "2026-11-15 09:00:00+00"}
          # Equal report times: the one with a vehicle wins; then the entity key.
          - {trip_id: B, start_date: "2026-11-15", fetched_at: "2026-11-15 10:00:00+00", entity_id: b1, entity_ts: "2026-11-15 09:59:00+00"}
          - {trip_id: B, start_date: "2026-11-15", fetched_at: "2026-11-15 10:00:00+00", entity_id: b2, entity_ts: "2026-11-15 09:59:00+00", vehicle_id: "7"}
          - {trip_id: C, start_date: "2026-11-15", fetched_at: "2026-11-15 10:00:00+00", entity_id: c2, entity_ts: null}
          - {trip_id: C, start_date: "2026-11-15", fetched_at: "2026-11-15 10:00:00+00", entity_id: c1, entity_ts: null}
          # The central rule (research doc): a newer CANCELED without a vehicle beats an older
          # SCHEDULED report that still has one.
          - {trip_id: D, start_date: "2026-11-15", fetched_at: "2026-11-15 10:00:00+00", entity_id: d1, entity_ts: "2026-11-15 09:58:00+00", vehicle_id: "9"}
          - {trip_id: D, start_date: "2026-11-15", fetched_at: "2026-11-15 10:00:00+00", entity_id: d2, entity_ts: "2026-11-15 09:59:00+00", trip_schedule_relationship: CANCELED}
          # A report without Metro's timestamp ranks last, even though its fallback (the fetch
          # time) is later than the other's timestamp.
          - {trip_id: N, start_date: "2026-11-15", fetched_at: "2026-11-15 10:00:00+00", entity_id: n1, entity_ts: null, trip_schedule_relationship: CANCELED}
          - {trip_id: N, start_date: "2026-11-15", fetched_at: "2026-11-15 10:00:00+00", entity_id: n2, entity_ts: "2026-11-15 09:59:00+00"}
    expect:
      rows:
        - {trip_id: A, service_date: "2026-11-15", fetched_at: "2026-11-15 10:00:00+00", entity_key: a1, is_chosen: false, n_reports: 2, trip_schedule_relationship: CANCELED, n_stop_updates: 0}
        - {trip_id: A, service_date: "2026-11-15", fetched_at: "2026-11-15 10:00:00+00", entity_key: a2, is_chosen: true, n_reports: 2, trip_schedule_relationship: SCHEDULED, n_stop_updates: 2}
        - {trip_id: A, service_date: "2026-11-15", fetched_at: "2026-11-15 10:01:00+00", entity_key: a1, is_chosen: true, n_reports: 1, trip_schedule_relationship: CANCELED, n_stop_updates: 0}
        - {trip_id: A, service_date: "2026-11-16", fetched_at: "2026-11-15 10:00:00+00", entity_key: a3, is_chosen: true, n_reports: 1, trip_schedule_relationship: SCHEDULED, n_stop_updates: 0}
        - {trip_id: B, service_date: "2026-11-15", fetched_at: "2026-11-15 10:00:00+00", entity_key: b1, is_chosen: false, n_reports: 2, trip_schedule_relationship: SCHEDULED, n_stop_updates: 0}
